[versions]
kotlin = "2.1.21"
compileSdk = "36"
buildTools = "35.0.0"
minSdk = "26"
targetSdk = "36"
versionCode = "1"
versionName = "1.0.0"
androidGradlePlugin = "8.13.0"
googleServicesPlugin = "4.4.2"
firebaseCrashPlugin = "3.0.2"
playServicesGsmLocation = "21.3.0"
playServicesHome = "16.0.0"

core-ktx = "1.18.0"
appcompat = "1.7.1"
fragment-ktx = "1.8.9"
activity-ktx = "1.9.3"
material = "1.12.0"
navigation = "2.7.7"
lifecycle-version = "2.8.7"
lifecycle-ext = "2.2.0"

firebase-bom = "34.14.0"

security-crypto = "1.0.0"
timber = "5.0.1"

webkit = "1.16.0"
dagger = "2.59.2"
room = "2.8.4"

okhttp = "4.12.0"
retrofit = "2.11.0"
retrofit-kotlinx-serialization = "1.0.0"
retrofit-scalars = "2.11.0"

kotlinx-serialization-json = "1.8.1"
paging-compose = "3.3.6"
reorderable = "2.4.3"

junit = "4.13.2"
androidx-junit = "1.3.0"
androidx-espresso-core = "3.7.0"
androidx-espresso = "3.7.0"

compose = "1.7.8"
compose-material3 = "1.3.2"
compose-activity = "1.9.3"
compose-viewmodel = "2.8.7"
compose-coil = "2.7.0"
landscapist = "2.3.2"
accompanist = "0.31.3-beta"

appId = "com.anadolstudio.homehub"
testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

[libraries]


android-gradle-plugin = { group = "com.android.tools.build", name = "gradle", version.ref = "androidGradlePlugin" }
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-serialization", version.ref = "kotlin" }
compose-compiler-gradle-plugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }

# Android UI
androidx-core-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-fragment = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment-ktx" }
androidx-activity = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity-ktx" }

material = { group = "com.google.android.material", name = "material", version.ref = "material" }

navigation-fragment = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
navigation-ui = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation" }

lifecycle-extensions = { group = "androidx.lifecycle", name = "lifecycle-extensions", version.ref = "lifecycle-ext" }
lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle-version" }
lifecycle-livedata = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycle-version" }
lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle-version" }

lifecycle-compiler = { group = "androidx.lifecycle", name = "lifecycle-compiler", version.ref = "lifecycle-version" }

# Firebase
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebase-bom" }
firebase-inappmessaging = { group = "com.google.firebase", name = "firebase-inappmessaging" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics"  }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }

#Utils
security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "security-crypto" }
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }
paging-runtime = { group = "androidx.paging", name = "paging-runtime-ktx", version.ref = "paging-compose" }
paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "paging-compose" }
reorderable = { group = "sh.calvin.reorderable", name = "reorderable", version.ref = "reorderable" }

#WebView
webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }

#Dagger
dagger = { group = "com.google.dagger", name = "dagger", version.ref = "dagger" }
dagger-compiler = { group = "com.google.dagger", name = "dagger-compiler", version.ref = "dagger" }

#Room
room = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

#Network
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofit-kotlinx-serialization" }
retrofit-scalars = { group = "com.squareup.retrofit2", name = "converter-scalars", version.ref = "retrofit-scalars" }

#Compose
accompanist-navigation-material = { group = "com.google.accompanist", name = "accompanist-navigation-material", version.ref = "accompanist" }
accompanist-systemuicontroller = { group = "com.google.accompanist", name = "accompanist-systemuicontroller", version.ref = "accompanist" }
accompanist-webview = { group = "com.google.accompanist", name = "accompanist-webview", version.ref = "accompanist" }
compose-material = { group = "androidx.compose.material", name = "material", version.ref = "compose" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "compose" }
compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "compose" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "compose" }

compose-runtime-livedata = { group = "androidx.compose.runtime", name = "runtime-livedata", version.ref = "compose" }
compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core", version.ref = "compose" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "compose" }

compose-material3-window = { group = "androidx.compose.material3", name = "material3-window-size-class", version.ref = "compose-material3" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "compose-material3" }
compose-activity = { group = "androidx.activity", name = "activity-compose", version.ref = "compose-activity" }
compose-coil = { group = "io.coil-kt", name = "coil-compose", version.ref = "compose-coil" }
compose-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "compose-viewmodel" }
landscapist-glide = { group = "com.github.skydoves", name = "landscapist-glide", version.ref = "landscapist" }
landscapist-placeholder = { group = "com.github.skydoves", name = "landscapist-placeholder", version.ref = "landscapist" }
compose-runtime = { group = "androidx.compose.runtime", name = "runtime", version.ref = "compose"}


compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "compose" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest", version.ref = "compose" }

#Test
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-junit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidx-espresso-core" }
androidx-espresso = { group = "androidx.test.espresso", name = "espresso-contrib", version.ref = "androidx-espresso" }

#Other
google-services = { module = "com.google.gms:google-services", version.ref = "googleServicesPlugin" }
play-services-gsm-location = { module = "com.google.android.gms:play-services-location", version.ref = "playServicesGsmLocation" }

# Matter commissioning: Google Home Mobile SDK (Commissioning API через Google Play Services).
play-services-home = { module = "com.google.android.gms:play-services-home", version.ref = "playServicesHome" }
firebase-crashlytics-plugin = { module = "com.google.firebase:firebase-crashlytics-gradle", version.ref = "firebaseCrashPlugin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
android-test = { id = "com.android.test", version.ref = "androidGradlePlugin" }

kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashPlugin" }

[bundles]

android-ui = [
    "androidx-core-core-ktx",
    "androidx-appcompat",
    "androidx-fragment",
    "androidx-activity",
    "material",
    "navigation-fragment",
    "navigation-ui",
    "lifecycle-extensions",
    "lifecycle-viewmodel",
    "lifecycle-livedata",
    "lifecycle-runtime",
]

firebase = [
    "firebase-inappmessaging",
    "firebase-analytics",
    "firebase-crashlytics",
]

utils = [
    "security-crypto",
    "timber",
    "kotlin-stdlib",
    "kotlinx-serialization-json",
    "paging-runtime",
    "paging-compose",
]

android-test = [
    "androidx-junit",
    "androidx-espresso-core",
    "androidx-espresso",
]

compose = [
    "accompanist-navigation-material",
    "accompanist-systemuicontroller",
    "compose-material",
    "compose-foundation",
    "compose-ui",
    "compose-ui-tooling-preview",
    "compose-runtime-livedata",
    "compose-material-icons-core",
    "compose-material-icons-extended",
    "compose-material3-window",
    "compose-material3",
    "compose-activity",
    "compose-coil",
    "compose-viewmodel",
    "landscapist-glide",
    "landscapist-placeholder",
    "compose-runtime",
]
